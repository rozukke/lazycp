[package]
name = "lazycp"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "lcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "env"] }
path-clean = "1.0.1"
reverse-lines = "0.1.1"
ssh2 = "0.9.5"
walkdir = "2.5.0"
